# Base de données : PostgreSQL gratuit hébergé chez Neon (https://neon.tech), hors Render.
# Les valeurs de connexion se saisissent dans Render (Environment), jamais dans le code.
services:
  - type: web
    name: motosur-mali
    runtime: docker
    plan: free
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: prod
      - key: DB_HOST
        sync: false
      - key: DB_PORT
        value: "5432"
      - key: DB_NAME
        sync: false
      - key: DB_USER
        sync: false
      - key: DB_PASSWORD
        sync: false
      - key: MAINTENANCE_EMAIL
        value: aboubacar.c130@icloud.com
      # Secret : à saisir par le propriétaire dans Render (12 caractères minimum). Jamais dans le code.
      - key: MAINTENANCE_PASSWORD
        sync: false
