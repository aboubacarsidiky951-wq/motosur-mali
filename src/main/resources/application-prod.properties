# Production (Render) : PostgreSQL, aucun mot de passe par défaut.
spring.datasource.url=jdbc:postgresql://${DB_HOST}:${DB_PORT:5432}/${DB_NAME}?sslmode=${DB_SSLMODE:require}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}
server.servlet.session.cookie.secure=true
motosur.maintenance.email=${MAINTENANCE_EMAIL:}
motosur.maintenance.password=${MAINTENANCE_PASSWORD:}

# Base gratuite externe (Neon) : elle se met en veille ; on évite de garder des connexions mortes.
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=0
spring.datasource.hikari.idle-timeout=120000
spring.datasource.hikari.max-lifetime=240000
spring.datasource.hikari.connection-timeout=30000
