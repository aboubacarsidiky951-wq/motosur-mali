# Profil par défaut = développement local (base H2 en mémoire).
server.port=${PORT:8080}
server.forward-headers-strategy=native
server.servlet.session.timeout=24h
server.servlet.session.cookie.max-age=24h
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
server.error.include-message=never
server.error.include-stacktrace=never
spring.jpa.open-in-view=false
spring.jpa.hibernate.ddl-auto=update
spring.datasource.url=jdbc:h2:mem:motosur;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
motosur.version=0.1.0
# Comptes de départ (développement uniquement). En production, ces valeurs viennent de Render.
motosur.maintenance.email=${MAINTENANCE_EMAIL:maintenance@dev.local}
motosur.maintenance.password=${MAINTENANCE_PASSWORD:dev-only-password-123}

# Les pages se remettent à jour chez les visiteurs dès qu'une nouvelle version est en ligne.
spring.web.resources.cache.cachecontrol.no-cache=true
spring.web.resources.cache.cachecontrol.must-revalidate=true

# SMS (Twilio) : à renseigner dans Render, jamais dans le code.
motosur.sms.twilio.sid=${TWILIO_ACCOUNT_SID:}
motosur.sms.twilio.token=${TWILIO_AUTH_TOKEN:}
motosur.sms.twilio.from=${TWILIO_FROM:}
